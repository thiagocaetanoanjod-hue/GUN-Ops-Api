spring.application.name=ops-api

# Configuração do Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:gun_ops_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o painel visual do banco no navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostra os comandos SQL no terminal para você acompanhar o que acontece
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update